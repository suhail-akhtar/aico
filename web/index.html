<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0D0D0D" />
    <!--
      No remote font or script tags. The page is served by a local process that
      can run shell commands; pulling code from a CDN into it would put a third
      party inside that trust boundary for no benefit.
    -->
    <title>AICO</title>
    <!--
      Set the theme before the first paint. Waiting for React to mount and for
      the settings request to land is two round trips of white page on a
      dark-mode machine. The stored preference replaces this the moment it
      arrives; until then, following the system is the best available guess.
    -->
    <script>
      document.documentElement.dataset.theme =
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
