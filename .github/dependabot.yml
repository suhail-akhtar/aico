# Dependency updates (ADR 0026). Security updates arrive as soon as an
# advisory is published (repository setting "Dependabot security updates");
# version updates are weekly and grouped so they review as one change per
# package, not thirty. Every update still goes through CI: the audit, lockfile
# and licence checks in the `security` job, and the full test suite.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      engine-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      vscode-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /vscode-extension/webview
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      vscode-webview-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
