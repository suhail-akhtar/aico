name: CI

on:
  push:
    branches: [main, aico-v0.02]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both versions report, so one failing never hides whether the other passes:
      # with fail-fast on, a failing 20 job cancelled 22 on every run for weeks.
      fail-fast: false
      matrix:
        # 22 is the floor: aico uses Node's built-in `node:sqlite`, which arrived
        # in 22.5 (`engines` says so too). Node 20 failed every run with
        # ERR_UNKNOWN_BUILTIN_MODULE. 24 is here so a break on current Node is
        # caught before users on it are.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Ensure tests don't try to connect to real providers
          CI: true

      # The web client's own unit suites (reducer, navigation, settings schema).
      # They were never run here, and a stale assertion sat red for two releases.
      - name: Install web client dependencies
        run: npm --prefix web ci || npm --prefix web install

      - name: Web unit tests
        run: npm run test:web:unit

      # The desktop app's pure modules: the widget kit, the maths core (plot,
      # geometry, calc), plugin manifests, prefs, turn grouping, theme. No
      # Electron needed, so its download is skipped.
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --ignore-scripts || npm --prefix desktop install --ignore-scripts

      - name: Desktop unit tests
        run: npm --prefix desktop test
