name: CI

on:
  push:
    branches: [main, aico-v0.02]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the floor because playwright-core requires it, and the browser
        # verification gate is not an optional part of this tool. 18 is also
        # end-of-life. 22 is here so a break on current Node is caught before
        # users on it are.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Ensure tests don't try to connect to real providers
          CI: true
