name: Desktop

# Builds AICO Desktop for Windows (NSIS installer) and Linux (AppImage, deb).
# On a version tag the installers are attached to that GitHub release (a
# draft), the update feeds are verified against them, and only then is the
# release published; on a manual run they are kept as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the installers to this release tag (e.g. v0.23.0); empty keeps them as artifacts only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install engine dependencies
        run: npm ci

      - name: Install web client dependencies (the shared store and renderers)
        run: npm --prefix web ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Desktop unit tests
        run: npm --prefix desktop test

      - name: Typecheck
        run: npm --prefix desktop run typecheck

      - name: Package
        run: npm --prefix desktop run package:${{ matrix.target }}
        env:
          # No code-signing certificate is configured; electron-builder must not
          # go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # What the release is made of (ADR 0026): CycloneDX SBOMs from the
      # lockfiles via npm's own `npm sbom`, attached beside the installers.
      - name: SBOM (CycloneDX)
        if: matrix.target == 'linux'
        run: node scripts/security-deps.mjs sbom --out desktop/release

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: aico-desktop-${{ matrix.target }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest*.yml
            desktop/release/*.blockmap
            desktop/release/*.cdx.json
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release is created as a DRAFT (with notes) by scripts/release.mjs
          # when the tag is pushed; wait for it briefly rather than racing it.
          TAG="${{ inputs.release }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          # latest*.yml and the blockmaps are what installed copies read to
          # find, verify and (differentially) download an update.
          gh release upload "$TAG" $(ls desktop/release/*.exe desktop/release/*.AppImage desktop/release/*.deb desktop/release/latest*.yml desktop/release/*.blockmap desktop/release/*.cdx.json 2>/dev/null) --clobber

  # Installed copies read the LATEST published release's latest*.yml. 0.37.0 was
  # published ~24 minutes before its feed was attached, so an update check in
  # that window failed and waited six hours. Now the release stays a draft
  # until both builds have uploaded and the feeds are proven to name — and hash
  # to — the installers actually attached; only then is it published.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Feeds match the attached installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          node scripts/verify-update-feed.mjs "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          # Only a draft is published (and so becomes Latest). Re-attaching to an
          # already-published release (a manual run) changes nothing about it.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          else
            echo "$TAG is already published"
          fi
