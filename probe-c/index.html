<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>probe-c</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eef1f6;
      font-family: system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px 36px;
      border: 1px solid #d3d9e2;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
      color: #0f172a;
    }
    #start {
      width: 100%;
      font-size: 22px;
      font-weight: 600;
      padding: 16px 0;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }
    #start:hover {
      background: #1d4ed8;
    }
    #status {
      width: 100%;
      font-size: 28px;
      font-weight: 500;
      color: #111827;
      padding: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Status Probe</h1>
    <button id="start">Start</button>
    <div id="status">Idle</div>
  </div>
  <script>
    document.getElementById('start').addEventListener('click', function () {
      document.getElementById('status').textContent = 'Running';
    });
  </script>
</body>
</html>
