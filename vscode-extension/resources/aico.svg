<!--
  The view-container icon.

  Monochrome and stroked, because VS Code tints activity-bar and side-bar icons
  itself: it recolours by `fill`/`stroke: currentColor` to match the active and
  inactive states of the theme. A coloured or filled logo here would ignore that
  and be the one icon in the bar that never dims.

  24×24 with a 2px stroke is the size every built-in icon is drawn at; anything
  else reads as slightly wrong next to them without being obviously different.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- The asterisk aico uses as its mark everywhere else. -->
  <path d="M12 4v16"/>
  <path d="M4.9 8l14.2 8"/>
  <path d="M4.9 16l14.2-8"/>
</svg>
