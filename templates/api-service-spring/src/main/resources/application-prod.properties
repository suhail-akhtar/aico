# Active in the container image (SPRING_PROFILES_ACTIVE=prod). One JSON object per log line, with
# the request id, ready for any log pipeline. The interactive API explorer stays off unless
# APP_DOCS_ENABLED=true is set deliberately.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=api-service
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:false}
