# Configuration comes from the environment only. Each setting is mapped here, once, so the full
# list of knobs is greppable. Required values have no default: a missing one stops startup with
# the name of the variable. For local runs, values may also sit in .env / .env.local (the
# KEY=value files below; both are git-ignored and optional).
spring.application.name=api-service
spring.config.import=optional:file:./.env[.properties],optional:file:./.env.local[.properties]

# --- HTTP ---------------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${APP_SHUTDOWN_TIMEOUT:20s}
# No "Server: Apache-Coyote" fingerprint.
server.server-header=
server.max-http-request-header-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.enabled=false
spring.main.banner-mode=off
# One virtual thread per request: blocking JDBC code scales without a tuned thread pool.
spring.threads.virtual.enabled=true
# Defaults for any RestClient built from the auto-configured builder: no outbound call hangs.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# --- Database -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# --- JSON wire format -----------------------------------------------------------------------
# Every JSON property name is snake_case (created_at, next_cursor, access_token): one naming
# strategy for requests and responses, so no field can drift to camelCase and the OpenAPI document
# follows it. Records and fields stay idiomatic Java. A float where an integer belongs
# ("quantity": 1.5) is a 400, not a silent truncation.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false

# --- Application settings (validated in AppProperties) -------------------------------------
# Who authenticates callers: "local" (this service registers users, logs them in and signs HS256
# tokens; needs APP_JWT_SECRET) or "oidc" (it only verifies RS256 access tokens from an external
# provider, typically behind a gateway; needs OIDC_ISSUER, OIDC_JWKS_URI and OIDC_AUDIENCE).
app.auth.mode=${APP_AUTH_MODE:local}
app.auth.oidc.issuer=${OIDC_ISSUER:}
app.auth.oidc.jwks-uri=${OIDC_JWKS_URI:}
app.auth.oidc.audience=${OIDC_AUDIENCE:}
app.auth.oidc.clock-skew=${OIDC_CLOCK_SKEW:30s}
app.auth.oidc.jwks-min-refresh=${OIDC_JWKS_MIN_REFRESH:30s}
# Empty default on purpose: required in local mode (ConfigurationCheck says so), absent in oidc mode.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=${APP_JWT_ISSUER:api-service}
app.jwt.audience=${APP_JWT_AUDIENCE:api-service}
app.jwt.ttl=${APP_JWT_TTL:15m}
app.security.bcrypt-cost=${APP_BCRYPT_COST:12}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:120}
app.rate-limit.refill-per-minute=${APP_RATE_LIMIT_PER_MINUTE:120}
app.rate-limit.auth-capacity=${APP_RATE_LIMIT_AUTH_CAPACITY:10}
app.rate-limit.auth-refill-per-minute=${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
app.http.max-body-size=${APP_MAX_BODY_SIZE:256KB}

# --- API documents -------------------------------------------------------------------------
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:true}
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.disable-swagger-default-url=true

# --- Health and observability --------------------------------------------------------------
# /healthz = liveness (process is up, no dependencies), /readyz = readiness (database reachable).
# Only the health endpoint is exposed over the web; nothing else is reachable.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.additional-path=server:/healthz
management.endpoint.health.group.readiness.additional-path=server:/readyz
management.endpoint.health.group.readiness.include=readinessState,db
# OpenTelemetry: the app is always instrumented (spans, metrics, log correlation) but exports
# nothing unless APP_OTEL_ENABLED=true, so a bare run never tries to reach a collector. Point it at
# a collector with OTEL_EXPORTER_OTLP_ENDPOINT (see docs/EXTENDING.md, "Turn on telemetry").
app.otel.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
management.tracing.export.otlp.enabled=${APP_OTEL_ENABLED:false}
management.otlp.metrics.export.enabled=${APP_OTEL_ENABLED:false}
management.logging.export.otlp.enabled=${APP_OTEL_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${app.otel.endpoint}/v1/traces
management.otlp.metrics.export.url=${app.otel.endpoint}/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=${app.otel.endpoint}/v1/logs
management.tracing.sampling.probability=${APP_TRACING_SAMPLE_RATE:0.1}
