# Test profile. Datasource properties come from TestDatabase (Testcontainers or H2).
# The secret below is a fake used only by the tests, never a real credential.
app.jwt.secret=test-only-fake-jwt-signing-key-0123456789abcdef
app.jwt.issuer=api-service
app.jwt.audience=api-service
app.security.bcrypt-cost=10
app.rate-limit.capacity=100000
app.rate-limit.refill-per-minute=100000
app.rate-limit.auth-capacity=100000
app.rate-limit.auth-refill-per-minute=100000
app.cors.allowed-origins=https://app.example.com
app.http.max-body-size=16KB
app.jwt.ttl=15m
