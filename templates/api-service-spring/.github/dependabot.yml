version: 2
updates:
  # Maven: the Spring Boot parent, plugins and the few pinned libraries in pom.xml.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
    commit-message:
      prefix: "chore(deps)"

  # Base images pinned by digest in the Dockerfile and compose.yaml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # Actions are pinned by commit SHA; Dependabot rewrites both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
