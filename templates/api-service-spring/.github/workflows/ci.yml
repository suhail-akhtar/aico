name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, static analysis, unit + integration tests on PostgreSQL, coverage gate, packaging, SBOM.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fail instead of silently falling back to H2 when Docker is missing.
      AICO_TEST_DB: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (format, Error Prone + NullAway, tests, coverage, SpotBugs, SBOM)
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: |
            target/site/jacoco
            target/failsafe-reports
            target/surefire-reports
            target/spring-modulith-docs
            target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: ignore

  # Dependency vulnerabilities, from the SBOM the build produced. Fails on any finding that is not
  # listed (with a reason) in osv-scanner.toml.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp -q -DskipTests -Dspotless.check.skip=true process-resources
      - name: OSV-Scanner
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa \
            scan source --config osv-scanner.toml -L target/classes/META-INF/sbom/application.cdx.json

  # Committed secrets, whole history.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --redact /repo

  # The image: build it and walk the real API from outside (non-root, read-only, probes, login).
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: node scripts/smoke.mjs
