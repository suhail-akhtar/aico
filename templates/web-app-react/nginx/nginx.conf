# The production web server: static files only, as a non-root user, on a read-only filesystem.
# Everything nginx writes goes under /tmp (a tmpfs in compose). The container runs
# /usr/local/bin/entrypoint.sh, which writes /tmp/runtime/config.json from the environment first.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 15s;
  # A static server takes no request bodies.
  client_max_body_size 1k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 8k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout combined;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Liveness for the container healthcheck and orchestrators. No dependency to check.
    location = /healthz {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    # Runtime configuration, written at start by entrypoint.sh. Never cached.
    location = /config.json {
      alias /tmp/runtime/config.json;
      default_type application/json;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # Fingerprinted by the build: safe to cache for a year.
    location /assets/ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # No API here: the gateway routes /api elsewhere. Answering 404 JSON (not index.html)
    # keeps a misrouted API call from "succeeding" with HTML.
    location ^~ /api/ {
      default_type application/problem+json;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 404 '{"title":"Not Found","status":404,"detail":"No API is configured behind this web server."}';
    }

    # Used by the gateway's forward-auth for unsafe /api requests that lack the CSRF header.
    location = /__csrf_rejected {
      default_type application/problem+json;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 403 '{"title":"Forbidden","status":403,"detail":"State-changing requests must send the X-Requested-With: fetch header."}';
    }

    # Dotfiles and source maps are never served.
    location ~ /\.|\.map$ {
      include /etc/nginx/security-headers.conf;
      return 404;
    }

    # Single-page app: any other path is a client-side route.
    location / {
      try_files $uri /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
