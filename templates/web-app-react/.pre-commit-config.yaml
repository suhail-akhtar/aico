# Hooks run on `git commit` (`make setup` installs them). CI re-runs everything:
# hooks are a convenience, not the gate.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: biome
        name: biome check (format, lint, imports)
        entry: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
