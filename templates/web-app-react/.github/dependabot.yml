version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # TypeScript, Vite and the test runners move together and break together: review them as one.
      toolchain:
        patterns: ["typescript", "vite", "vitest", "@vitest/*", "@vitejs/*", "@biomejs/*", "msw", "jsdom"]
      tanstack:
        patterns: ["@tanstack/*"]
      minor-and-patch:
        update-types: [minor, patch]
    # The generator and the committed client must change together: Dependabot opens the bump, the
    # `gen:check` CI job fails until `npm run gen` is run and committed. That is intended.
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
