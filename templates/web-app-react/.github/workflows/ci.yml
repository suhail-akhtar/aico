# CI for the web app. Every third-party action is pinned to a full commit SHA with its tag in a
# comment (a tag can be moved; a SHA cannot), and Dependabot keeps the pins fresh. Tools that
# publish container images (gitleaks, osv-scanner, trivy, Playwright) run from images pinned
# by digest instead of through a marketplace action.
# `make check` is the same gate you run locally.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: format, lint, types, generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format (Biome)
        run: npm run fmt:check
      - name: Lint, including accessibility rules (Biome)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: The generated client and route tree are current
        run: npm run gen:check

  test:
    name: unit and component tests (85% gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info

  e2e:
    name: end-to-end (Playwright, desktop and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - name: Browser suite against the built app and the mock gateway
        run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  build:
    name: production build and container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: web-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (non-root, read-only filesystem, no capabilities)
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 web-app:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/config.json | grep -q '"apiBaseUrl":"/api"'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(docker exec web id -u)" = "101"
          # A cross-origin API URL must stop the container, not be served.
          if docker run --rm -e API_BASE_URL=https://evil.example/api web-app:ci; then
            echo "the entrypoint accepted a foreign API URL" >&2
            exit 1
          fi
      - name: Image vulnerabilities (fail on HIGH or CRITICAL with a fix available)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 web-app:ci

  security:
    name: dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high and critical fail; reviewed, expiring allow-list)
        run: npm run audit
      - name: osv-scanner over the lockfile
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --lockfile=package-lock.json
      - name: gitleaks over the history
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact .
      - name: SBOM (CycloneDX) of the locked dependencies
        run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
