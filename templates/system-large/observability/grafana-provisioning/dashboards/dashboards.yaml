# Dashboard provider: Grafana loads every JSON under the path below and re-reads it every 30
# seconds, so a merged dashboard change appears without a restart. Mount ../../dashboards at
# /var/lib/grafana/dashboards and this file at /etc/grafana/provisioning/dashboards.
# allowUiUpdates is false: the files are the truth; edit the JSON in git, not in the browser.
apiVersion: 1

providers:
  - name: system
    orgId: 1
    folder: System
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
