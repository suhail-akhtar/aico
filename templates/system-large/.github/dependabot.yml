version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(terraform)"
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/prod
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(terraform)"
