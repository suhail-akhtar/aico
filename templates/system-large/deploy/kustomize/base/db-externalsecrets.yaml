# Database credentials, as references. The values live in the secret manager (populated out
# of band, see infra/terraform); External Secrets Operator writes the Kubernetes Secrets.
#
# The role password is the SAME remote property the service reads (DATABASE_PASSWORD in the
# remote secret system/<env>/api (the worker reads the same one)): CloudNativePG sets it on the role, the service
# presents it. Rotating it in the store rotates both on the next refresh. The remote keys
# below are the dev defaults; overlays rewrite them per environment (see overlays/*).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-db-app
  labels:
    system.example.test/db-role: app
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform}
  target:
    name: system-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: system/dev/api, property: DATABASE_PASSWORD}
---
# Object-store credentials for the database backups (see the backup section of the Cluster).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system-db-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform}
  target:
    name: system-db-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: system/dev/db-backup, property: ACCESS_KEY_ID}
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: {key: system/dev/db-backup, property: SECRET_ACCESS_KEY}
