# Local clusters only (kind, k3d): the "fake" provider serves the values written below, so
# the whole stack starts without a secret manager. The values are obviously fake. Never use
# it anywhere a real secret could end up in git: staging and production use the AWS store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    fake:
      data:
        # standards-allow: secret (fake development canaries)
        - key: system/dev/api
          valueMap:
            DATABASE_PASSWORD: change-me-db
            VALKEY_PASSWORD: change-me-valkey
            OIDC_CLIENT_SECRET: change-me-oidc
            S3_ACCESS_KEY: change-me-s3-access
            S3_SECRET_KEY: change-me-s3-secret
            SMTP_PASSWORD: change-me-smtp
