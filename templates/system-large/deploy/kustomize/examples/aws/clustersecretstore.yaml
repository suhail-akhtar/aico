# Example, not applied by any overlay (it is cluster-scoped and provider specific). Apply it
# once per cluster from the platform layer. The ServiceAccount carries the IRSA role that
# infra/terraform/modules/secrets creates (output: external_secrets_role_arn), so the cluster
# holds NO long-lived cloud credentials. Name must stay "platform": the chart refers to it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
