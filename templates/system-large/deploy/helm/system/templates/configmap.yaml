{{- range $name, $raw := .Values.services }}
{{- $svc := mergeOverwrite (deepCopy $.Values.serviceDefaults) (deepCopy $raw) }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $env := include "system.env" $ctx | fromYaml }}
---
# Non-secret configuration only. Secrets live in the ExternalSecret and never in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "system.labels" $ctx | nindent 4 }}
data:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  APP_SERVICE_NAME: {{ $name | quote }}
{{- end }}
{{- end }}
