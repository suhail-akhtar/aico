{{- if .Values.global.externalSecrets.enabled }}
{{- range $name, $raw := .Values.services }}
{{- $svc := mergeOverwrite (deepCopy $.Values.serviceDefaults) (deepCopy $raw) }}
{{- if and $svc.enabled $svc.secrets.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
# The Secret "{{ $name }}-secrets" is created and refreshed by External Secrets Operator from the
# secret manager behind the ClusterSecretStore. Only references are in git, never values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "system.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.global.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.global.externalSecrets.secretStoreRef.kind }}
    name: {{ $.Values.global.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $svc.secrets.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.global.externalSecrets.remoteKeyPrefix (default $name $svc.secrets.remoteName) }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
