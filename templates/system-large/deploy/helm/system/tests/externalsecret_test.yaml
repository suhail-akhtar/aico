suite: external secrets
templates:
  - templates/externalsecret.yaml
tests:
  - it: one ExternalSecret per service that needs secrets (api, worker), none for web
    asserts:
      - hasDocuments:
          count: 2
  - it: points at the platform ClusterSecretStore with no values in the manifest
    documentSelector:
      path: metadata.name
      value: api-secrets
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: platform
      - equal:
          path: spec.data[0].remoteRef.key
          value: system/dev/api
      - lengthEqual:
          path: spec.data
          count: 6
      - notExists:
          path: spec.data[0].value
  - it: renders nothing when external secrets are disabled
    set:
      global.externalSecrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: the worker reads the API's remote secret, not a second copy
    documentSelector:
      path: metadata.name
      value: worker-secrets
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: system/dev/api
