# Wave 1. Traefik v3.7.13 (chart 41.6.1) in its own namespace; its CRDs (Middleware) are needed
# by the application chart's rate limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.6.1
      helm:
        releaseName: traefik
        valueFiles:
          - $values/deploy/gitops/argocd/platform/values/traefik.yaml
    - repoURL: https://github.com/example-org/system.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
