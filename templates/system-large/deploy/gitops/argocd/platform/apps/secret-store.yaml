# Wave 1 (needs the External Secrets CRDs from wave 0). Applies the AWS ClusterSecretStore
# "platform" from deploy/kustomize/examples/aws (the fake development store lives in a sibling
# directory and is never synced). Another provider: point path at a directory of your own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/example-org/system.git
    targetRevision: main
    path: deploy/kustomize/examples/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
