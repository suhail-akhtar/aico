# Ingress controller (Traefik v3.7.13, chart 41.6.1). One entry point for app.<domain> and
# idp.<domain>; the application chart renders the Ingress and the rate-limit Middleware.
# Runs in its own namespace "traefik": the chart's NetworkPolicy peer "ingress-controller"
# selects exactly that namespace name.
deployment:
  replicas: 2
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true
log:
  format: json
  level: INFO
accessLog:
  enabled: true
  format: json
podDisruptionBudget:
  enabled: true
  minAvailable: 1
