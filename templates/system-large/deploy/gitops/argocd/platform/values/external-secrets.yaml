# External Secrets Operator (chart 2.11.0). Reads the secret manager through the
# ClusterSecretStore "platform" and writes Kubernetes Secrets; the cluster stores references,
# never values. On EKS the controller's ServiceAccount is annotated with the IRSA role from
# infra/terraform (output external_secrets_role_arn): no long-lived cloud keys in the cluster.
installCRDs: true
replicaCount: 2
serviceAccount:
  create: true
  name: external-secrets
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<name>-<env>-external-secrets
podDisruptionBudget:
  enabled: true
  minAvailable: 1
