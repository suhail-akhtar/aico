# Configuration comes from the environment only. Each setting is mapped here, once, so the full
# list of knobs is greppable. Required values have no default: a missing one stops startup with
# the name of the variable. For runs outside compose, values may also sit in a .env file (KEY=value
# lines, git-ignored and optional).
spring.application.name=system-api
spring.config.import=optional:file:./.env[.properties]

# --- HTTP ---------------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${APP_SHUTDOWN_TIMEOUT:20s}
# The proxy (Traefik) is the only way in and overwrites X-Forwarded-*; trust it for the client
# address and the public scheme and host (used to build the OIDC redirect URI).
server.forward-headers-strategy=framework
server.server-header=
server.max-http-request-header-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.enabled=false
spring.main.banner-mode=off
# One virtual thread per request: blocking JDBC code scales without a tuned thread pool.
spring.threads.virtual.enabled=true
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# --- Session (server-side, in Valkey) ----------------------------------------------------------
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:false}
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:8h}
spring.session.redis.namespace=system:sessions
spring.session.redis.flush-mode=immediate

# --- Valkey ------------------------------------------------------------------------------
spring.data.redis.host=${VALKEY_HOST}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=2s

# --- Database -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# --- OpenID Connect (Keycloak): the browser login (BFF) -------------------------------------------
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${OIDC_CLIENT_ID:system-web}
spring.security.oauth2.client.registration.keycloak.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
# Bearer tokens (machine clients) must be minted for this API.
app.security.audience=${OIDC_AUDIENCE:system-api}
app.security.secure-cookies=${APP_SECURE_COOKIES:false}

# --- Application settings (validated in AppProperties) -------------------------------------
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.api-per-minute=${APP_RATE_LIMIT_API_PER_MINUTE:300}
app.rate-limit.auth-per-minute=${APP_RATE_LIMIT_AUTH_PER_MINUTE:30}
app.http.max-body-size=${APP_MAX_BODY_SIZE:256KB}
app.http.max-upload-size=${APP_MAX_UPLOAD_SIZE:5MB}
app.jobs.enabled=${APP_JOBS_ENABLED:false}
app.jobs.republish-after=${APP_REPUBLISH_AFTER:30s}
app.jobs.republish-every=${APP_REPUBLISH_EVERY:30s}
app.jobs.keep-completed-events=${APP_KEEP_COMPLETED_EVENTS:7d}
app.jobs.keep-processed-messages=${APP_KEEP_PROCESSED:30d}
app.storage.provider=${APP_STORAGE_PROVIDER:s3}
app.storage.endpoint=${S3_ENDPOINT:}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:attachments}
app.storage.access-key=${S3_ACCESS_KEY:}
app.storage.secret-key=${S3_SECRET_KEY:}
app.storage.create-bucket=${S3_CREATE_BUCKET:false}
app.storage.path-style=${S3_PATH_STYLE:true}
app.flags.provider=${APP_FLAGS_PROVIDER:flagd}
app.flags.flagd-host=${FLAGD_HOST:localhost}
app.flags.flagd-port=${FLAGD_PORT:8013}
app.mail.from=${MAIL_FROM:noreply@system.example.test}
app.mail.base-url=${APP_PUBLIC_URL:http://localhost:8080}

# --- Outbox: Spring Modulith event publication registry ---------------------------------------
# Flyway creates the table (V2). Completed publications are marked, not deleted, and the worker
# purges them after a retention period; incomplete ones are resubmitted by the worker.
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=update
spring.modulith.events.republish-outstanding-events-on-restart=false

# --- Email ---------------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- API documents -------------------------------------------------------------------------
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:true}
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.disable-swagger-default-url=true

# --- Health and observability --------------------------------------------------------------
# /healthz = liveness (process is up, no dependencies), /readyz = readiness (database and Valkey
# reachable). Object storage and SMTP are not part of readiness: the API can serve most requests
# without them, and a mail outage must not take the site out of rotation.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.additional-path=server:/healthz
management.endpoint.health.group.readiness.additional-path=server:/readyz
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.mail.enabled=false
# OpenTelemetry: always instrumented, exports only when APP_OTEL_ENABLED=true.
app.otel.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
management.tracing.export.otlp.enabled=${APP_OTEL_ENABLED:false}
management.otlp.metrics.export.enabled=${APP_OTEL_ENABLED:false}
management.logging.export.otlp.enabled=${APP_OTEL_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${app.otel.endpoint}/v1/traces
management.otlp.metrics.export.url=${app.otel.endpoint}/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=${app.otel.endpoint}/v1/logs
management.tracing.sampling.probability=${APP_TRACING_SAMPLE_RATE:0.1}
management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:system-api}
