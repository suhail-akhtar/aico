# Test profile. Datasource and Valkey properties come from TestInfrastructure (containers, or the
# TEST_* variables CI supplies). Everything below is a fake used only by the tests.
spring.security.oauth2.client.registration.keycloak.client-secret=test-only-fake-client-secret
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://idp.test/realms/app
app.rate-limit.api-per-minute=100000
app.rate-limit.auth-per-minute=100000
app.http.max-body-size=16KB
app.http.max-upload-size=64KB
app.storage.provider=memory
app.flags.provider=memory
app.jobs.enabled=false
