[project]
name = "api-service"
version = "0.1.0"
description = "A FastAPI service: Pydantic v2, async SQLAlchemy 2, Alembic, Argon2id, JWT with refresh rotation."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi[opentelemetry]==0.142.2",
  "pydantic[email]==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.3",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "pwdlib[argon2]==0.3.1",
  "pyjwt[crypto]==2.15.1",
  "structlog==26.1.0",
  "limits==5.8.0",
  "uvicorn==0.54.0",
  "uvloop==0.23.0; sys_platform != 'win32'",
  "httptools==0.8.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "hypothesis==6.168.5",
  "schemathesis==4.29.3",
  "aiosqlite==0.22.1",
  "watchfiles==1.3.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PL", "PT", "RUF",
  "S",    # bandit rules, so ruff catches most of it in the editor too
  "ASYNC", "DTZ", "T20", "TID", "PERF", "FAST", "TC", "ARG", "ERA", "PIE", "FURB",
]
ignore = [
  "PLR0913",  # FastAPI handlers take many injected parameters by design
  "PLR2004",  # magic numbers in tests and status codes read better inline
  "B008",     # Depends() in a default argument is how FastAPI works
  "TC001", "TC002", "TC003",  # FastAPI/pydantic need runtime-evaluated annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ARG001", "ARG002", "PLR0915"]
"src/app/db/migrations/**" = ["N999", "ERA001"]
"src/app/cli.py" = ["T201"]
"src/app/db/types.py" = ["ARG002"]  # SQLAlchemy fixes the TypeDecorator signature

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:schemathesis.*"]
markers = [
  "postgres: needs a real PostgreSQL (set TEST_DATABASE_URL); the default run uses SQLite",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["src/app/db/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '\.\.\.']

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
