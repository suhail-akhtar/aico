# Optional git hooks: `pip install pre-commit && pre-commit install` (CI runs the same checks).
# Hooks are advisory: CI is the gate.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: pint
        name: Pint (format check, in Docker)
        entry: docker compose run --rm tools composer lint
        language: system
        pass_filenames: false
        types: [php]
      - id: conventional-commit
        name: Conventional Commit message
        entry: sh -c 'grep -Eq "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+" "$1" || { echo "Use a Conventional Commit subject (feat: ..., fix: ...)"; exit 1; }' --
        language: system
        stages: [commit-msg]
