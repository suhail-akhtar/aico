; Production PHP settings. Loaded after the image defaults (zz- prefix).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
zend.exception_ignore_args = On
; The image is immutable: files never change after build, so skip the stat() calls.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Request body limits (Caddy enforces the same ceiling before PHP sees the bytes).
post_max_size = 2M
upload_max_filesize = 2M
max_execution_time = 30
memory_limit = 256M
session.cookie_httponly = 1
session.use_strict_mode = 1
