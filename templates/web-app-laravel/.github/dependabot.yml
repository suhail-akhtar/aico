version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      laravel:
        patterns: ["laravel/*", "livewire/*", "dedoc/*"]
      testing:
        patterns: ["pestphp/*", "phpunit/*", "larastan/*", "phpstan/*", "mockery/*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keeps the pinned image versions AND their digests fresh (Dockerfile, compose files).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Keeps the commit-SHA pins of the actions fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
