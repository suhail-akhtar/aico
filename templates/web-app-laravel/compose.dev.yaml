# Development overlay: `make dev` (= docker compose -f compose.yaml -f compose.dev.yaml up --build).
# Merged over compose.yaml: your working tree is mounted into the PHP containers,
# `php artisan serve` serves it directly (edit, refresh, see it), and Vite serves
# CSS/JS with hot reload on http://localhost:5173.
# This is NOT how it runs in production: compose.yaml is.

x-dev: &dev
  build:
    context: .
    target: tools
  image: __APP_SLUG__-tools:local
  read_only: false
  working_dir: /app
  volumes:
    - .:/app
    - vendor:/app/vendor
    - composer-cache:/home/dev/.cache/composer
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    LOG_LEVEL: debug
    API_DOCS_ENABLED: "true"
    PHP_CLI_SERVER_WORKERS: "4"

services:
  migrate:
    <<: *dev
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && php artisan migrate --force --seed"]

  app:
    <<: *dev
    command: ["php", "artisan", "app:dev", "--host=0.0.0.0", "--port=8080"]

  queue:
    <<: *dev
    command: ["php", "artisan", "queue:listen", "--tries=1"]

  scheduler:
    <<: *dev

  # Node lives only here and in the image build stage; the PHP containers never need it.
  vite:
    image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /app
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173} --strictPort"]

volumes:
  node_modules:
