# Local development and the Docker-only workflow.
#   docker compose up --build            API + PostgreSQL, API at http://localhost:${PORT:-8080}
#   docker compose up --build --watch    ... and rebuild the API when Go files change
#   docker compose --profile tools run --rm tools make check
#   docker compose --profile tools run --rm seed
# Secrets come from .env (`make setup` generates it); nothing sensitive is in this file.

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env (make setup does it)}
    volumes:
      - pgdata:/var/lib/postgresql
    # Published on loopback only, for `make cov` and psql from the host.
    # Set DB_PORT in .env if 5432 is taken (another local PostgreSQL).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Empty means "use the built-in default" (see README, Configure).
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-}
      SESSION_TTL: ${SESSION_TTL:-}
      # Identity-provider mode: AUTH_MODE=oidc makes the three OIDC_* settings required.
      AUTH_MODE: ${AUTH_MODE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLOCK_SKEW: ${OIDC_CLOCK_SKEW:-}
    ports:
      - "${PORT:-8080}:8080"
    # The container is read-only and unprivileged: the service writes nothing to disk.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./db
        - action: rebuild
          path: ./api
        - action: rebuild
          path: go.mod

  # The pinned toolchain: `docker compose --profile tools run --rm tools make check`.
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app?sslmode=disable
      REQUIRE_DB: "1"
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - golangcicache:/root/.cache/golangci-lint

  # Creates the demo account and sample items. Development only (the binary refuses in production).
  seed:
    profiles: [tools]
    build:
      context: .
      target: runtime
    command: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app?sslmode=disable
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD in .env}

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
  golangcicache:
