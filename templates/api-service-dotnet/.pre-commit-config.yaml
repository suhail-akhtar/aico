# pip install pre-commit && pre-commit install   (runs on every commit; CI runs the same checks)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format (whitespace, style, analyzers)
        entry: dotnet format ApiService.slnx --verify-no-changes
        language: system
        types: [c#]
        pass_filenames: false
